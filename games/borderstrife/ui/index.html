<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BorderStrife — Turn-Based Conquest</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/polish.css">
    <link rel="stylesheet" href="css/welcome.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="Play BorderStrife, a browser strategy game of turn-based conquest. Command armies across regional maps and historic battlefields against the AI.">
    <meta property="og:title" content="BorderStrife — Turn-Based Conquest">
    <meta property="og:description" content="Every turn redraws the map. Command armies across regional maps and historic battlefields.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BorderStrife">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://wgf-website-xwculczjca-ez.a.run.app/borderstrife/">
    <meta property="og:url" content="https://wgf-website-xwculczjca-ez.a.run.app/borderstrife/">
    <meta property="og:image" content="https://wgf-website-xwculczjca-ez.a.run.app/borderstrife/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="BorderStrife — Every turn redraws the map. Turn-based conquest.">
</head>
<body class="welcome-page">
    <main class="welcome-card">
        <header class="welcome-logo">
            <h1>BorderStrife</h1>
            <p class="subtitle">Every turn redraws the map.</p>
        </header>
        <div class="setup-tabs" role="tablist" aria-label="Play BorderStrife">
            <button type="button" id="new-game-tab" role="tab" aria-selected="true" aria-controls="new-game-form">New game</button>
            <button type="button" id="resume-game-tab" role="tab" aria-selected="false" aria-controls="saved-campaigns" tabindex="-1">Resume game</button>
        </div>
        <form id="new-game-form" class="new-game-form" role="tabpanel" aria-labelledby="new-game-tab" data-step="maps">
            <fieldset class="map-picker">
                <legend>Choose your map</legend>
                <div class="map-categories" role="group" aria-label="Map category">
                    <button type="button" data-category="world" aria-pressed="true">Regional Maps</button>
                    <button type="button" data-category="historical" aria-pressed="false">Historical Battles</button>
                    <button type="button" data-category="campaigns" aria-pressed="false">Historical Campaigns</button>
                    <button type="button" data-category="sieges" aria-pressed="false">Cities &amp; Sieges</button>
                    <button type="button" data-category="legends" aria-pressed="false">Epics</button>
                </div>
                <p id="category-description" class="preset-desc">Choose a theater for conquest.</p>
                <div id="map-grid" class="map-grid" aria-busy="true" tabindex="0" role="group" aria-label="Available maps">
                    <div class="map-skeleton" aria-hidden="true"></div><div class="map-skeleton" aria-hidden="true"></div><p class="sr-only" role="status">Loading maps…</p>
                </div>
                <p class="map-scroll-hint">Scroll within the maps to browse more.</p>
            </fieldset>
            <section id="preset-options" class="setup-panel" aria-label="Campaign setup">
                <button type="button" id="back-to-maps" class="btn-secondary">← Choose map</button>
                <img id="selected-map-preview" alt="" width="300" height="180" hidden>
                <h2 id="selected-map-title" tabindex="-1">Choose a map</h2>
                <p id="selected-map-summary" class="preset-desc"></p>
                <p id="battle-essentials" class="preset-desc" hidden></p>
                <div class="form-group">
                    <label id="starting-label" for="kingdom-select">Starting kingdom</label>
                    <select id="kingdom-select" disabled><option>Loading kingdoms…</option></select>
                    <p class="preset-desc" id="kingdom-preview" aria-live="polite"></p>
                </div>
                <details id="map-details">
                    <summary>Map details &amp; rules</summary>
                    <p class="preset-desc" id="preset-desc"></p>
                    <p id="starting-details" class="preset-desc"></p>
                    <div id="battle-briefing" hidden></div>
                </details>
                <details id="customize-names">
                    <summary>Customize names</summary>
                    <div class="form-group">
                        <label for="player-name">Commander name</label>
                        <input type="text" id="player-name" value="Consul" maxlength="24" autocomplete="nickname">
                    </div>
                    <div class="form-group">
                        <label for="campaign-name">Campaign name <span>(optional)</span></label>
                        <input type="text" id="campaign-name" placeholder="Named automatically" maxlength="80">
                    </div>
                </details>
            </section>
            <footer class="setup-actions">
                <p id="error-msg" class="error-msg hidden" role="alert"></p>
                <button type="button" id="retry-maps" class="btn-secondary" hidden>Retry loading maps</button>
                <span id="mobile-selection" class="preset-desc" aria-live="polite">Choose your map</span>
                <button type="button" class="btn-primary" id="continue-setup" disabled>Next: choose your side</button>
                <button type="submit" class="btn-primary" id="start-btn" disabled>Begin Campaign</button>
            </footer>
        </form>
        <section id="saved-campaigns" role="tabpanel" aria-labelledby="resume-game-tab" hidden>
            <h2>Your campaigns</h2>
            <p class="save-explainer">Turns save automatically. Resume links are kept in this browser.</p>
            <div id="campaign-list"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/campaigns.js"></script>
    <script src="js/welcome.js"></script>
</body>
</html>
