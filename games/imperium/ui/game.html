<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPERIUM — Campaign</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body class="game-page">

    <!-- Top bar -->
    <div id="top-bar">
        <span class="game-title">IMPERIUM</span>
        <span class="turn-badge">Turn <span id="turn-num">—</span></span>

        <div class="player-stats">
            <div class="stat-block">
                <div class="stat-name p1-text" id="p1-name">—</div>
                <div class="stat-values">
                    <span id="p1-regions">—</span> regions &nbsp;·&nbsp;
                    <span id="p1-army">—</span> troops
                </div>
            </div>

            <span class="vs-divider">VS</span>

            <div class="stat-block right">
                <div class="stat-name p2-text" id="p2-name">—</div>
                <div class="stat-values">
                    <span id="p2-regions">—</span> regions &nbsp;·&nbsp;
                    <span id="p2-army">—</span> troops
                </div>
            </div>
        </div>
    </div>

    <!-- Main -->
    <div id="main">

        <!-- Map -->
        <div id="map-container">
            <svg id="map-svg" viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <marker id="arr-gold" markerWidth="7" markerHeight="5" refX="5" refY="2.5" orient="auto">
                        <polygon points="0 0, 7 2.5, 0 5" fill="#d4a840"/>
                    </marker>
                    <marker id="arr-p1" markerWidth="7" markerHeight="5" refX="5" refY="2.5" orient="auto">
                        <polygon points="0 0, 7 2.5, 0 5" fill="#4a90d4"/>
                    </marker>
                    <filter id="glow-p1">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                    <filter id="glow-gold">
                        <feGaussianBlur stdDeviation="4" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>
                <g id="g-edges"></g>
                <g id="g-arrows"></g>
                <g id="g-regions"></g>
            </svg>

            <!-- Terrain legend -->
            <div class="map-legend">
                <div class="legend-item">
                    <div class="legend-dot" style="background:#4a90d4;"></div> You
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#d44a4a;"></div> AI
                </div>
                <div class="legend-item">
                    <div class="legend-dot" style="background:#555568;border:1px solid #888"></div> Neutral
                </div>
            </div>

            <!-- Resolving overlay -->
            <div id="resolving-overlay" class="hidden">
                <span class="resolving-msg">Resolving Turn…</span>
            </div>

            <!-- Game over overlay -->
            <div id="gameover-overlay" class="hidden">
                <div class="gameover-title" id="gameover-title">—</div>
                <div class="gameover-subtitle" id="gameover-subtitle">—</div>
            </div>
        </div>

        <!-- Side panel -->
        <div id="side-panel">

            <!-- Region info -->
            <div class="panel-section" id="region-info-section">
                <div class="panel-label">Region</div>
                <div id="region-info">
                    <p class="no-selection">Click a region to inspect it.</p>
                </div>
            </div>

            <!-- Pending moves / combat log -->
            <div class="panel-section" style="border-bottom:none; padding-bottom:6px;">
                <div class="panel-label" id="panel-moves-label">Planned Moves</div>
            </div>
            <div id="moves-list">
                <p class="no-moves-msg">No moves planned. Select one of your regions to order an advance.</p>
            </div>

            <!-- Combat log (shown after turn resolution) -->
            <div id="combat-log-section" class="panel-section hidden" style="border-bottom:none; padding-bottom:6px;">
                <div class="panel-label">Battle Report — Turn <span id="log-turn">—</span></div>
            </div>
            <div id="combat-log" class="hidden"></div>
        </div>
    </div>

    <!-- Bottom bar -->
    <div id="bottom-bar">
        <span class="move-hint" id="move-hint">Select one of your regions to begin.</span>
        <button id="end-turn-btn">End Turn</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
