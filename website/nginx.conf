server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* to the backend service.
    # IMPERIUM_API_URL env var is injected at container start by nginx's template engine.
    location /api/ {
        proxy_pass ${IMPERIUM_API_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /imperium/ {
        try_files $uri $uri/ /imperium/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
