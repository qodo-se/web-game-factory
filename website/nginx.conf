server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Versioned geography is immutable. HTML and scripts keep revalidating.
    location ~ ^/borderstrife/maps/(?:(?:thumbnails|terrain)/)?[a-z0-9_]+_v[0-9]+\.(?:json|svg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy /api/* to the backend service.
    # IMPERIUM_API_URL env var is injected at container start by nginx's template engine.
    location /api/ {
        client_max_body_size 16m;
        proxy_pass ${IMPERIUM_API_URL}/api/;
        # Cloud Run must route this request to the API service's hostname.
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Preserve old campaign URLs, asset paths and query strings.
    location ~ ^/imperium(?:/(.*))?$ {
        return 308 /borderstrife/$1$is_args$args;
    }

    location = /borderstrife {
        return 308 /borderstrife/$is_args$args;
    }

    location /borderstrife/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
